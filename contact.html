
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | Gayathri Portfolio</title>

    <meta name="description"
          content="Contact Gayathri through this accessible portfolio contact form.">

    <meta name="robots"
          content="index, follow">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- Skip Navigation -->

    <a href="#main-content"
       class="skip-link">

        Skip to Main Content

    </a>

    <!-- Header -->

    <header role="banner">

        <div class="header-container">

            <h1 class="logo">
                Contact Me
            </h1>

            <nav aria-label="Primary Navigation">

                <ul>

                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="about.html">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="projects.html">
                            Projects
                        </a>
                    </li>

                    <li>
                        <a href="contact.html"
                           aria-current="page">
                            Contact
                        </a>
                    </li>
                    <li><a href="todo.html">To-Do App</a></li>

                </ul>

                <button id="theme-toggle"
                        class="btn">

                    🌙 Dark Mode

                </button>

            </nav>

        </div>

    </header>

    <!-- Main Content -->

    <main id="main-content"
          aria-label="Main Content">

        <section aria-labelledby="contact-heading">

            <h2 id="contact-heading">

                Get In Touch

            </h2>

            <form id="contact-form"
                  class="contact-form"
                  action="#"
                  method="post"
                  aria-label="Contact Form">

                <label for="name">

                    Full Name

                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    aria-required="true">

                <label for="email">

                    Email Address

                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    aria-required="true"
                    aria-describedby="email-help">

                <small id="email-help">

                    Please enter a valid email address.

                </small>

                <label for="subject">

                    Subject

                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject">

                <label for="message">

                    Message

                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required
                    aria-required="true"></textarea>

                <button type="submit"
                        class="btn">

                    Send Message

                </button>

            </form>

        </section>

    </main>

    <!-- Footer -->

    <footer>

        <p>

            &copy;
            <span id="year"></span>

            Gayathri.

            All Rights Reserved.

        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
